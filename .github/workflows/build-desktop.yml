name: Build City Shooter Desktop

on:
  workflow_dispatch: {}
  push:
    branches: [claude/browser-game-real-cities-6vugme, main]
    paths:
      - "game/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install desktop deps (builds client + installs server)
        working-directory: game/desktop
        run: npm install
      - name: Build Windows installer + portable
        working-directory: game/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CityShooter-Windows
          path: |
            game/desktop/dist/*.exe
            game/desktop/dist/*.blockmap
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install desktop deps
        working-directory: game/desktop
        run: npm install
      - name: Build AppImage
        working-directory: game/desktop
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: CityShooter-Linux
          path: game/desktop/dist/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install desktop deps
        working-directory: game/desktop
        run: npm install
      - name: Build DMG (unsigned)
        working-directory: game/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: CityShooter-macOS
          path: game/desktop/dist/*.dmg
          if-no-files-found: error
