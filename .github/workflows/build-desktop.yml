name: Build REALWAR Roma Desktop

on:
  workflow_dispatch: {}
  push:
    branches: [claude/browser-game-real-cities-6vugme, main]
    paths:
      - "game/play.html"
      - "game/desktop/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop deps
        working-directory: game/desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows exe
        working-directory: game/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: List dist/
        if: always()
        working-directory: game/desktop
        shell: bash
        run: ls -la dist || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: REALWAR-Roma-Windows
          path: |
            game/desktop/dist/*.exe
          if-no-files-found: error
