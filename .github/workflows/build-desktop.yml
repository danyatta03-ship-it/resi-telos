name: Build City Shooter Desktop

on:
  workflow_dispatch: {}
  push:
    branches: [claude/browser-game-real-cities-6vugme, main]
    paths:
      - "game/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write client .env with Mapbox token
        working-directory: game/client
        shell: bash
        run: |
          if [ -z "${{ secrets.VITE_MAPBOX_TOKEN }}" ]; then
            echo "::error::Missing repo secret VITE_MAPBOX_TOKEN. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}" > .env

      - name: Install desktop deps (triggers client build + server install)
        working-directory: game/desktop
        run: npm install

      - name: Build Windows installer + portable
        working-directory: game/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CityShooter-Windows
          path: |
            game/desktop/dist/*.exe
            game/desktop/dist/*.blockmap
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write client .env
        working-directory: game/client
        run: |
          if [ -z "${{ secrets.VITE_MAPBOX_TOKEN }}" ]; then
            echo "::error::Missing repo secret VITE_MAPBOX_TOKEN."
            exit 1
          fi
          echo "VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}" > .env
      - name: Install desktop deps
        working-directory: game/desktop
        run: npm install
      - name: Build AppImage
        working-directory: game/desktop
        run: npm run dist:linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CityShooter-Linux
          path: game/desktop/dist/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write client .env
        working-directory: game/client
        shell: bash
        run: |
          if [ -z "${{ secrets.VITE_MAPBOX_TOKEN }}" ]; then
            echo "::error::Missing repo secret VITE_MAPBOX_TOKEN."
            exit 1
          fi
          echo "VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}" > .env
      - name: Install desktop deps
        working-directory: game/desktop
        run: npm install
      - name: Build DMG (unsigned)
        working-directory: game/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CityShooter-macOS
          path: game/desktop/dist/*.dmg
          if-no-files-found: error
