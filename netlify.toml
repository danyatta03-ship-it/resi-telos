[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

# L'invio dei resi NON sta piu' qui: e' un sito Netlify separato, con base
# directory "portal" e le sue due function. Le rotte /api/portal-* sono state
# tolte perche' puntavano a function che questo sito non ha piu'.
# Vedi PORTALE.md.

# v35o — Security headers (audit cybersec).
# Applicati a TUTTE le route dell'app; le SPA le vedono sulle response del CDN Netlify.
# NB: durante lo sviluppo locale (python3 -m http.server / dev-server.js) questi
# header NON vengono applicati — vale solo il deploy Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: 1 anno + subdomini + preload (una volta abilitato non tornare piu' indietro)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # No sniff MIME (blocca certi trick di XSS che caricano JS da immagini)
    X-Content-Type-Options = "nosniff"
    # Anti-clickjacking (belt & suspenders con frame-ancestors nel CSP)
    X-Frame-Options = "DENY"
    # Referrer minimo per privacy senza rompere link interni
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permission Policy: solo camera+geolocation dal proprio origine; disabilita il resto
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"
    # CSP: Firebase SDK da gstatic, Tesseract/html5-qrcode/qrcode fallback da unpkg+cdnjs,
    #   AI upstream via generativelanguage (solo per fallback diretto) e via /api/gemini
    #   proxy, RTDB su wss://*.firebasedatabase.app + https REST, api.openai.com fallback.
    #   'unsafe-inline' su script/style resta necessario perche' l'app usa onclick=..
    #   e style="..." dappertutto (refactor pianificato).
    # v35r — connect-src rilassato a https:/wss: dopo report "Firebase non connette".
    # v39 — Quella correzione era meta' della cura, e per mesi ha nascosto l'altra
    #   meta'. Il Realtime Database NON apre il websocket per primo: stabilisce
    #   una connessione in long-polling e poi la promuove. Il long-polling
    #   funziona INIETTANDO TAG <script> verso <database>.firebasedatabase.app,
    #   quindi passa da script-src, non da connect-src. Con quel dominio assente
    #   da script-src il browser bloccava il trasporto iniziale, la connessione
    #   non si stabiliva mai e non si arrivava nemmeno a tentare il websocket:
    #   l'SDK restava muto — nessun errore, solo silenzio, su qualunque rete.
    #   Da qui "Timeout: nessuna risposta dal database" anche sotto rete mobile,
    #   dove nessun firewall aziendale poteva entrarci.
    #   Aggiunti i due domini del database a script-src. La protezione XSS resta:
    #   sono host di Google, non origini arbitrarie.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Il Service Worker deve stare a scope root e non essere cache-lock-in
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

# Chi arriva su /portal/ con un vecchio link trova la pagina che indica
# l'indirizzo giusto, invece di una copia dell'app senza le sue function
# (che fallirebbe ad ogni invio, in silenzio).
[[redirects]]
  from = "/portal/*"
  to = "/portale-spostato.html"
  status = 302
  force = true
