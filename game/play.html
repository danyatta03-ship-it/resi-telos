<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>City Shooter</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body { margin:0; height:100%; background:#87ceeb; overflow:hidden; font-family:system-ui,sans-serif; color:#fff; user-select:none; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #crosshair { position:absolute; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border:2px solid #fff; border-radius:50%; opacity:.85; }
  #stats { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.5); padding:8px 12px; border-radius:6px; font-size:14px; line-height:1.5; }
  #ammo { position:absolute; bottom:14px; right:14px; background:rgba(0,0,0,.55); padding:8px 16px; border-radius:8px; font:600 22px system-ui; }
  #hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:8px 14px; border-radius:8px; font-size:13px; }
  #hit { position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px; opacity:0; transition:opacity .1s;
    background: linear-gradient(45deg, transparent 45%, #ff5 45% 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #ff5 45% 55%, transparent 55%); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:6; box-shadow: inset 0 0 200px 40px rgba(255,0,0,0); transition:box-shadow .12s; }
  #dead { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:7; display:none; align-items:center; justify-content:center; font:600 28px system-ui; pointer-events:none; }
  #menu { position:fixed; inset:0; z-index:10; background:linear-gradient(180deg,#0b1220,#1a2a44); display:flex; align-items:center; justify-content:center; }
  #menu .card { background:rgba(0,0,0,.55); padding:26px 30px; border-radius:14px; text-align:center; min-width:280px; }
  #menu h1 { margin:0 0 4px; font-size:28px; }
  #menu p { color:#9db; margin:0 0 20px; font-size:13px; }
  #menu button { padding:12px 30px; background:#3d8bfd; color:#fff; border:none; border-radius:8px; font:600 15px system-ui; cursor:pointer; }
  #menu .k { color:#7c93a5; font-size:11px; margin-top:16px; line-height:1.6; }
</style>
</head>
<body>
<div id="menu"><div class="card">
  <h1>City Shooter</h1>
  <p>FPS con citta procedurale + bot</p>
  <button id="play">GIOCA</button>
  <div class="k">WASD muovi • Shift corri • Space salta<br>Click sinistro spara • R ricarica • Esc rilascia mouse</div>
</div></div>
<div id="hud">
  <div id="crosshair"></div>
  <div id="hit"></div>
  <div id="stats">HP <span id="hp">100</span> &nbsp; Kills <span id="kd">0</span></div>
  <div id="ammo">30 / 30</div>
  <div id="hint">Click sul canvas per catturare il mouse</div>
</div>
<div id="vignette"></div>
<div id="dead">SEI MORTO — respawn tra 2s</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 250);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x555577, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(60, 100, 40);
scene.add(sun);

// ---------- City (grid of buildings + streets) ----------
const CITY_SIZE = 6;        // 6x6 blocks
const BLOCK = 20;           // meters per block
const STREET = 6;           // street width
const buildings = []; // { mesh, min, max }

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshLambertMaterial({ color: 0x2f2f38 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// street stripes
for (let i = -CITY_SIZE; i <= CITY_SIZE; i++) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 0.4),
    new THREE.MeshBasicMaterial({ color: 0xffee44 })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.02, i * BLOCK);
  scene.add(line);
  const line2 = line.clone();
  line2.rotation.z = Math.PI/2;
  line2.position.set(i * BLOCK, 0.02, 0);
  scene.add(line2);
}

const buildColors = [0x8a8f98, 0xa8b0b8, 0x7c8590, 0x9098a3, 0xb0b8c0, 0x6c7580];
for (let ix = -CITY_SIZE; ix <= CITY_SIZE; ix++) {
  for (let iz = -CITY_SIZE; iz <= CITY_SIZE; iz++) {
    if (ix === 0 && iz === 0) continue; // spawn area
    // 1 or 2 buildings per block
    const cx = ix * BLOCK;
    const cz = iz * BLOCK;
    const inner = BLOCK - STREET;
    const count = Math.random() < 0.35 ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const w = 4 + Math.random() * (inner/count - 2);
      const d = 4 + Math.random() * (inner/count - 2);
      const h = 4 + Math.pow(Math.random(), 1.6) * 40;
      const x = cx + (Math.random() - 0.5) * (inner - w);
      const z = cz + (Math.random() - 0.5) * (inner - d);
      const color = buildColors[(Math.random() * buildColors.length) | 0];
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
      );
      mesh.position.set(x, h/2, z);
      scene.add(mesh);
      buildings.push({
        mesh,
        min: new THREE.Vector3(x - w/2, 0, z - d/2),
        max: new THREE.Vector3(x + w/2, h, z + d/2),
      });
    }
  }
}

// ---------- Player ----------
const EYE = 1.7, RADIUS = 0.5;
const player = {
  pos: new THREE.Vector3(0, EYE, 0),
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  onGround: true, hp: 100, kills: 0, dead: false,
};
const keys = new Set();
let locked = false;
const canvas = renderer.domElement;

document.getElementById("play").onclick = () => {
  document.getElementById("menu").style.display = "none";
  canvas.requestPointerLock();
};
canvas.addEventListener("click", () => { if (!locked && !player.dead) canvas.requestPointerLock(); });
document.addEventListener("pointerlockchange", () => { locked = document.pointerLockElement === canvas; });
document.addEventListener("mousemove", (e) => {
  if (!locked) return;
  player.yaw   -= e.movementX * 0.0025;
  player.pitch -= e.movementY * 0.0025;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
});
addEventListener("keydown", (e) => keys.add(e.code));
addEventListener("keyup",   (e) => keys.delete(e.code));

function forward(v = new THREE.Vector3()) { v.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)); return v; }
function right(v = new THREE.Vector3())   { v.set( Math.cos(player.yaw), 0, -Math.sin(player.yaw)); return v; }
function lookDir(v = new THREE.Vector3()) {
  const cp = Math.cos(player.pitch);
  v.set(-Math.sin(player.yaw)*cp, Math.sin(player.pitch), -Math.cos(player.yaw)*cp);
  return v;
}

// Collision: AABB vs player circle in horizontal plane
function collideHoriz(pos, delta) {
  const attempts = [
    { x: delta.x, z: delta.z },
    { x: delta.x, z: 0 },
    { x: 0,       z: delta.z },
  ];
  const feetY = pos.y - EYE + 0.5;
  const headY = pos.y - 0.1;
  for (const d of attempts) {
    const nx = pos.x + d.x, nz = pos.z + d.z;
    let hit = false;
    for (const b of buildings) {
      if (b.max.y < feetY) continue; // below feet (can't happen normally)
      if (b.min.y > headY) continue;
      const cx = Math.max(b.min.x, Math.min(nx, b.max.x));
      const cz = Math.max(b.min.z, Math.min(nz, b.max.z));
      const dx = nx - cx, dz = nz - cz;
      if (dx*dx + dz*dz < RADIUS*RADIUS) { hit = true; break; }
    }
    if (!hit) { pos.x = nx; pos.z = nz; return; }
  }
}
function groundY(x, z) {
  let top = 0;
  for (const b of buildings) {
    if (x < b.min.x || x > b.max.x || z < b.min.z || z > b.max.z) continue;
    if (b.max.y > top) top = b.max.y;
  }
  return top;
}
// Hitscan raycast against buildings, returns t or Infinity
const rc = new THREE.Raycaster();
function raycastWorld(origin, dir, far) {
  rc.set(origin, dir); rc.far = far;
  const meshes = buildings.map(b => b.mesh);
  const hits = rc.intersectObjects(meshes, false);
  return hits.length ? hits[0] : null;
}

// ---------- Weapon (viewmodel) ----------
const vmScene = new THREE.Scene();
vmScene.add(new THREE.AmbientLight(0xffffff, 0.9));
const vmLight = new THREE.DirectionalLight(0xffffff, 0.5); vmLight.position.set(1,2,1); vmScene.add(vmLight);
const vmCam = new THREE.PerspectiveCamera(55, 1, 0.01, 5);
const gun = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.35), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
gunBody.position.set(0.15, -0.14, -0.32);
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 10), new THREE.MeshLambertMaterial({ color: 0x333 }));
gunBarrel.rotation.x = Math.PI/2; gunBarrel.position.set(0.15, -0.11, -0.5);
const gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.08), new THREE.MeshLambertMaterial({ color: 0x0f0f0f }));
gunGrip.position.set(0.15, -0.22, -0.2);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.35, 8), new THREE.MeshLambertMaterial({ color: 0xd7b48f }));
arm.rotation.z = Math.PI / 2.2; arm.position.set(0.05, -0.22, -0.15);
gun.add(gunBody, gunBarrel, gunGrip, arm);
const flash = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2),
  new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: 0, depthWrite: false }));
flash.position.set(0.15, -0.10, -0.66);
gun.add(flash);
vmScene.add(gun);
let gunKick = 0, gunBob = 0;

// ---------- Effects ----------
const fx = [];
function tracer(from, to) {
  const g = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const m = new THREE.LineBasicMaterial({ color: 0xffee88, transparent: true });
  const line = new THREE.Line(g, m); scene.add(line);
  fx.push({ obj: line, life: 0.08, decay: (o,t) => o.material.opacity = t });
}
function spark(at, color = 0xffaa33) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6),
    new THREE.MeshBasicMaterial({ color, transparent: true }));
  s.position.copy(at); scene.add(s);
  fx.push({ obj: s, life: 0.25, decay: (o,t) => { o.material.opacity = t; o.scale.setScalar(1 + (1-t)*2); } });
}
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const it = fx[i]; it.life -= dt;
    if (it.life <= 0) { scene.remove(it.obj); it.obj.geometry?.dispose?.(); it.obj.material?.dispose?.(); fx.splice(i,1); }
    else it.decay(it.obj, Math.max(0, it.life / 0.3));
  }
}

// ---------- Audio (procedural) ----------
let actx = null, master = null;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.3; master.connect(actx.destination);
}
addEventListener("click", initAudio, { once: true });
function envGain(dur, peak = 1) {
  const g = actx.createGain(); const t = actx.currentTime;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur); return g;
}
function noiseBuf(dur) {
  const b = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
  const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const s = actx.createBufferSource(); s.buffer = b; return s;
}
function sfxShoot(dist=0) {
  if (!actx) return;
  const gain = actx.createGain(); gain.gain.value = Math.max(0.05, 1 - dist/80); gain.connect(master);
  const n = noiseBuf(0.16); const bp = actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1800;
  const e = envGain(0.15, 1.2); n.connect(bp).connect(e).connect(gain); n.start(); n.stop(actx.currentTime+0.18);
  const o = actx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(180, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(50, actx.currentTime+0.08);
  const oe = envGain(0.09, 0.9); o.connect(oe).connect(gain); o.start(); o.stop(actx.currentTime+0.12);
}
function sfxHit() {
  if (!actx) return;
  const n = noiseBuf(0.05); const hp = actx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1200;
  const e = envGain(0.05, 0.6); n.connect(hp).connect(e).connect(master); n.start(); n.stop(actx.currentTime+0.06);
}
function sfxHitmark() {
  if (!actx) return;
  const o = actx.createOscillator(); o.type="square"; o.frequency.value=1400;
  const e = envGain(0.06, 0.35); o.connect(e).connect(master); o.start(); o.stop(actx.currentTime+0.07);
}
function sfxReload() {
  if (!actx) return;
  for (let i=0;i<2;i++) {
    const n = noiseBuf(0.05); const bp = actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=800; bp.Q.value=2;
    const g = actx.createGain(); const t = actx.currentTime + i*0.3;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.5, t+0.005); g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
    n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t+0.08);
  }
}
function sfxDeath() {
  if (!actx) return;
  const o = actx.createOscillator(); o.type="sawtooth";
  o.frequency.setValueAtTime(320, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, actx.currentTime+0.7);
  const e = envGain(0.7, 0.4); o.connect(e).connect(master); o.start(); o.stop(actx.currentTime+0.75);
}

// ---------- Bots ----------
const BOT_COUNT = 5;
const bots = [];
function spawnBot(color) {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.0, 4, 10),
    new THREE.MeshLambertMaterial({ color }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10),
    new THREE.MeshLambertMaterial({ color: 0xffd2a8 }));
  head.position.y = 0.95;
  grp.add(body, head);
  scene.add(grp);
  const bot = {
    group: grp, hp: 100,
    pos: new THREE.Vector3((Math.random()-0.5)*80, 0.85, (Math.random()-0.5)*80),
    dir: Math.random() * Math.PI * 2, dirTimer: 0, shootTimer: Math.random()*2,
    dead: false, respawnAt: 0,
  };
  grp.position.copy(bot.pos);
  bots.push(bot);
}
const botColors = [0xff4444, 0xff8844, 0xff4488, 0x8844ff, 0x44ff88];
for (let i=0;i<BOT_COUNT;i++) spawnBot(botColors[i]);

function botUpdate(bot, dt, now) {
  if (bot.dead) {
    if (now >= bot.respawnAt) {
      bot.dead = false; bot.hp = 100;
      bot.pos.set((Math.random()-0.5)*80, 0.85, (Math.random()-0.5)*80);
      bot.group.visible = true;
    }
    return;
  }
  // Wander: change dir every 1-3s, or if bumping into wall
  bot.dirTimer -= dt;
  if (bot.dirTimer <= 0) { bot.dir = Math.random()*Math.PI*2; bot.dirTimer = 1 + Math.random()*2; }
  const speed = 3;
  const step = new THREE.Vector3(Math.cos(bot.dir)*speed*dt, 0, Math.sin(bot.dir)*speed*dt);
  const before = bot.pos.x + bot.pos.z;
  const posV = new THREE.Vector3(bot.pos.x, bot.pos.y + EYE - 0.85, bot.pos.z);
  collideHoriz(posV, step);
  bot.pos.x = posV.x; bot.pos.z = posV.z;
  // If barely moved, change direction
  if (Math.abs((bot.pos.x + bot.pos.z) - before) < speed*dt*0.1) bot.dirTimer = 0;
  // Keep inside map
  const bound = CITY_SIZE * BLOCK;
  bot.pos.x = Math.max(-bound, Math.min(bound, bot.pos.x));
  bot.pos.z = Math.max(-bound, Math.min(bound, bot.pos.z));
  bot.pos.y = 0.85;
  bot.group.position.copy(bot.pos);
  bot.group.rotation.y = -bot.dir + Math.PI/2;

  // Shoot at player if line-of-sight
  bot.shootTimer -= dt;
  if (bot.shootTimer <= 0 && !player.dead) {
    bot.shootTimer = 0.8 + Math.random()*1.5;
    const from = bot.pos.clone(); from.y += 0.6;
    const to = player.pos.clone();
    const dir = to.clone().sub(from);
    const dist = dir.length();
    if (dist < 60) {
      dir.normalize();
      const hit = raycastWorld(from, dir, dist);
      if (!hit || hit.distance > dist - 0.5) {
        // Aim with error
        dir.x += (Math.random()-0.5) * 0.08;
        dir.y += (Math.random()-0.5) * 0.08;
        dir.z += (Math.random()-0.5) * 0.08;
        dir.normalize();
        const end = from.clone().addScaledVector(dir, 200);
        tracer(from, end);
        sfxShoot(dist);
        // Approx hit: within cone of player
        const toPlayer = player.pos.clone().sub(from).normalize();
        if (dir.dot(toPlayer) > 0.995) damagePlayer(12);
      }
    }
  }
}

function damagePlayer(dmg) {
  if (player.dead) return;
  player.hp = Math.max(0, player.hp - dmg);
  document.getElementById("hp").textContent = player.hp;
  const vig = document.getElementById("vignette");
  vig.style.boxShadow = `inset 0 0 220px 60px rgba(255,0,0,0.6)`;
  setTimeout(() => vig.style.boxShadow = "inset 0 0 200px 40px rgba(255,0,0,0)", 120);
  if (player.hp === 0) {
    player.dead = true; sfxDeath();
    document.getElementById("dead").style.display = "flex";
    setTimeout(() => {
      player.dead = false; player.hp = 100;
      player.pos.set(0, EYE, 0); player.vel.set(0,0,0);
      document.getElementById("hp").textContent = 100;
      document.getElementById("dead").style.display = "none";
    }, 2000);
  }
}

// ---------- Combat ----------
const MAG = 30;
let ammo = MAG, lastShotAt = 0, reloadingUntil = 0;
let mouseDown = false;
function updateAmmo() { document.getElementById("ammo").textContent = `${ammo} / ${MAG}`; }
canvas.addEventListener("mousedown", (e) => { if (e.button === 0) mouseDown = true; });
canvas.addEventListener("mouseup",   (e) => { if (e.button === 0) mouseDown = false; });
addEventListener("keydown", (e) => { if (e.code === "KeyR") reload(); });

function reload() {
  if (reloadingUntil > performance.now() || ammo === MAG) return;
  reloadingUntil = performance.now() + 1200;
  sfxReload();
  setTimeout(() => { ammo = MAG; updateAmmo(); }, 1200);
}
function shoot(now) {
  if (player.dead || !locked) return;
  if (now - lastShotAt < 90) return; // ~660 rpm
  if (reloadingUntil > now) return;
  if (ammo <= 0) { reload(); return; }
  lastShotAt = now; ammo -= 1; updateAmmo();
  gunKick = 0.1; flash.material.opacity = 1; flash.rotation.z = Math.random()*Math.PI;
  sfxShoot(0);

  const dir = lookDir().clone();
  dir.x += (Math.random()-0.5) * 0.008;
  dir.y += (Math.random()-0.5) * 0.008;
  dir.z += (Math.random()-0.5) * 0.008;
  dir.normalize();
  const eye = player.pos.clone();

  let bestT = 200, bestBot = null, bestPoint = null;
  const tmp = new THREE.Vector3();
  for (const b of bots) {
    if (b.dead) continue;
    tmp.copy(b.pos).sub(eye);
    const t = tmp.dot(dir);
    if (t < 0 || t > bestT) continue;
    const perpSq = tmp.lengthSq() - t*t;
    if (perpSq > 0.5*0.5) continue;
    bestT = t; bestBot = b;
    bestPoint = eye.clone().addScaledVector(dir, t);
  }
  const wall = raycastWorld(eye, dir, bestT);
  if (wall && wall.distance < bestT) { bestT = wall.distance; bestBot = null; bestPoint = wall.point; }
  const end = bestPoint ?? eye.clone().addScaledVector(dir, 200);
  tracer(eye.clone().addScaledVector(dir, 0.5), end);
  if (bestPoint) spark(bestPoint, bestBot ? 0xff5555 : 0xffcc55);
  if (bestBot) {
    bestBot.hp -= 25;
    document.getElementById("hit").style.opacity = "1";
    clearTimeout(window._hitT);
    window._hitT = setTimeout(() => document.getElementById("hit").style.opacity = "0", 100);
    sfxHitmark();
    if (bestBot.hp <= 0) {
      bestBot.dead = true; bestBot.group.visible = false; bestBot.respawnAt = performance.now() + 2500;
      player.kills += 1; document.getElementById("kd").textContent = player.kills;
    }
  }
}

// ---------- Loop ----------
const GRAV = 18, SPEED = 6, RUN = 10, JUMP = 5.5;
let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;

  if (locked && !player.dead) {
    const running = keys.has("ShiftLeft") || keys.has("ShiftRight");
    const s = running ? RUN : SPEED;
    const wish = new THREE.Vector3();
    const f = forward(), r = right();
    if (keys.has("KeyW")) wish.add(f);
    if (keys.has("KeyS")) wish.sub(f);
    if (keys.has("KeyD")) wish.add(r);
    if (keys.has("KeyA")) wish.sub(r);
    if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(s);
    player.vel.x = wish.x; player.vel.z = wish.z;
    player.vel.y -= GRAV * dt;
    if (player.onGround && keys.has("Space")) { player.vel.y = JUMP; player.onGround = false; }

    const delta = new THREE.Vector3(player.vel.x*dt, 0, player.vel.z*dt);
    collideHoriz(player.pos, delta);
    player.pos.y += player.vel.y * dt;
    const gy = groundY(player.pos.x, player.pos.z) + EYE;
    if (player.pos.y <= gy) { player.pos.y = gy; player.vel.y = 0; player.onGround = true; }
    else player.onGround = false;

    if (mouseDown) shoot(now);
  }

  for (const b of bots) botUpdate(b, dt, now);
  updateFx(dt);

  // Camera
  camera.position.copy(player.pos);
  const dir = lookDir();
  camera.lookAt(player.pos.x + dir.x, player.pos.y + dir.y, player.pos.z + dir.z);

  // Viewmodel
  gunBob += dt * (keys.has("KeyW")||keys.has("KeyS")||keys.has("KeyA")||keys.has("KeyD") ? 8 : 0);
  gun.position.x = Math.cos(gunBob*0.5)*0.005;
  gun.position.y = Math.sin(gunBob)*0.006 - gunKick;
  gun.rotation.x = -gunKick;
  gunKick = Math.max(0, gunKick - dt * 0.8);
  flash.material.opacity *= Math.pow(0.0005, dt);

  renderer.autoClear = true;
  renderer.render(scene, camera);
  // Draw viewmodel on top
  renderer.autoClear = false;
  renderer.clearDepth();
  vmCam.aspect = innerWidth/innerHeight; vmCam.updateProjectionMatrix();
  renderer.render(vmScene, vmCam);

  requestAnimationFrame(frame);
}
updateAmmo();
requestAnimationFrame(frame);
</script>
