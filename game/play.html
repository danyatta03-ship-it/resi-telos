<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>City Shooter</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body { margin:0; height:100%; background:#87ceeb; overflow:hidden; font-family:system-ui,sans-serif; color:#fff; user-select:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #crosshair { position:absolute; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border:2px solid #fff; border-radius:50%; opacity:.85; }
  #hit { position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px; opacity:0; transition:opacity .1s;
    background: linear-gradient(45deg, transparent 45%, #ff5 45% 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #ff5 45% 55%, transparent 55%); }
  #stats { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.5); padding:8px 12px; border-radius:6px; font-size:14px; line-height:1.5; min-width:150px; }
  #ammo { position:absolute; bottom:14px; right:14px; background:rgba(0,0,0,.55); padding:8px 16px; border-radius:8px; font:600 22px system-ui; }
  #weap { position:absolute; bottom:60px; right:14px; font:12px system-ui; color:#9db; text-align:right; }
  #grenCd { position:absolute; bottom:14px; right:150px; background:rgba(0,0,0,.5); padding:8px 12px; border-radius:8px; font:12px system-ui; }
  #reloading { position:absolute; top:55%; left:50%; transform:translateX(-50%); color:#fff; font:600 14px system-ui; opacity:0; text-shadow:0 1px 2px #000; }
  #killfeed { position:absolute; top:8px; right:200px; font:12px system-ui; text-align:right; text-shadow:0 1px 2px #000; }
  #killfeed div { background:rgba(0,0,0,.4); padding:3px 8px; border-radius:4px; margin-bottom:4px; display:inline-block; }
  #streak { position:absolute; top:130px; left:50%; transform:translateX(-50%);
    font:800 26px system-ui; color:#ffdd66; text-shadow:0 2px 6px #000, 0 0 20px rgba(255,180,0,.5);
    opacity:0; transition:opacity .2s; }
  #minimap { position:absolute; bottom:12px; left:12px; width:180px; height:180px; border-radius:12px;
    background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.2); overflow:hidden; }
  #minimap canvas { width:100%; height:100%; }
  #scoreboard { position:fixed; inset:8% 20%; background:rgba(0,10,20,.85); border-radius:12px; z-index:12;
    display:none; color:#fff; font:14px system-ui; padding:20px; overflow:auto; pointer-events:auto; }
  #scoreboard h2 { margin:0 0 12px; } #scoreboard table { width:100%; border-collapse:collapse; }
  #scoreboard td, #scoreboard th { padding:6px 10px; text-align:left; border-bottom:1px solid #234; }
  #scoreboard tr.me { background:rgba(80,140,255,.15); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:6; box-shadow: inset 0 0 200px 40px rgba(255,0,0,0); transition:box-shadow .12s; }
  #dead { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:7; display:none; align-items:center; justify-content:center; font:600 32px system-ui; pointer-events:none; }
  .tag { position:fixed; pointer-events:none; z-index:6; transform:translate(-50%,-100%); text-align:center; font:12px system-ui; text-shadow:0 1px 2px #000; }
  .tag .bar { width:70px; height:5px; background:rgba(255,255,255,.15); border-radius:3px; margin:2px auto 0; overflow:hidden; }
  .tag .bar span { display:block; height:100%; background:#4ade80; transition:width .15s; }
  #menu { position:fixed; inset:0; z-index:10; background:linear-gradient(180deg,#0b1220,#1a2a44); display:flex; align-items:center; justify-content:center; }
  #menu .card { background:rgba(0,0,0,.55); padding:26px 30px; border-radius:14px; text-align:center; min-width:320px; }
  #menu h1 { margin:0 0 4px; font-size:28px; } #menu p { color:#9db; margin:0 0 14px; font-size:13px; }
  #menu label { display:block; text-align:left; font-size:12px; color:#9db; margin-top:8px; }
  #menu input { width:100%; padding:9px 12px; border-radius:8px; border:1px solid #345; background:#0b1220; color:#fff; font-size:14px; box-sizing:border-box; }
  #menu button { width:100%; padding:12px 30px; background:#3d8bfd; color:#fff; border:none; border-radius:8px; font:600 15px system-ui; cursor:pointer; margin-top:14px; }
  #menu .k { color:#7c93a5; font-size:11px; margin-top:16px; line-height:1.6; text-align:left; }
</style>
</head>
<body>
<div id="menu"><div class="card">
  <h1>City Shooter</h1>
  <p>FPS con citta procedurale + bot</p>
  <label>Nome</label><input id="name" maxlength="14" value="player" />
  <button id="play">GIOCA</button>
  <div class="k">
    WASD muovi &bull; Shift corri &bull; Space salta &bull; C accovacciati<br>
    Click sx spara &bull; Click dx mira (ADS) &bull; R ricarica<br>
    1/2 cambia arma &bull; G granata &bull; Tab classifica &bull; Esc rilascia
  </div>
</div></div>
<div id="hud">
  <div id="crosshair"></div>
  <div id="hit"></div>
  <div id="stats"></div>
  <div id="killfeed"></div>
  <div id="streak"></div>
  <div id="weap"></div>
  <div id="ammo">30 / 30</div>
  <div id="grenCd">G 0.0s</div>
  <div id="reloading">RICARICA...</div>
  <div id="minimap"><canvas width="180" height="180"></canvas></div>
</div>
<div id="scoreboard"><h2>Classifica</h2><table id="scoreTable"></table></div>
<div id="vignette"></div>
<div id="dead">SEI MORTO — respawn tra 2s</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

// ======================================================================
// SCENE
// ======================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 280);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.HemisphereLight(0xffffff, 0x555577, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(60, 100, 40); scene.add(sun);

// ======================================================================
// CITY
// ======================================================================
const CITY_SIZE = 6, BLOCK = 20, STREET = 6;
const buildings = [];
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x2f2f38 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
for (let i = -CITY_SIZE; i <= CITY_SIZE; i++) {
  const line = new THREE.Mesh(new THREE.PlaneGeometry(600, 0.4), new THREE.MeshBasicMaterial({ color: 0xffee44 }));
  line.rotation.x = -Math.PI / 2; line.position.set(0, 0.02, i * BLOCK); scene.add(line);
  const line2 = line.clone(); line2.rotation.z = Math.PI/2; line2.position.set(i * BLOCK, 0.02, 0); scene.add(line2);
}
const buildColors = [0x8a8f98, 0xa8b0b8, 0x7c8590, 0x9098a3, 0xb0b8c0, 0x6c7580];
for (let ix = -CITY_SIZE; ix <= CITY_SIZE; ix++) {
  for (let iz = -CITY_SIZE; iz <= CITY_SIZE; iz++) {
    if (ix === 0 && iz === 0) continue;
    const cx = ix * BLOCK, cz = iz * BLOCK, inner = BLOCK - STREET;
    const count = Math.random() < 0.35 ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const w = 4 + Math.random() * (inner/count - 2);
      const d = 4 + Math.random() * (inner/count - 2);
      const h = 4 + Math.pow(Math.random(), 1.6) * 40;
      const x = cx + (Math.random() - 0.5) * (inner - w);
      const z = cz + (Math.random() - 0.5) * (inner - d);
      const color = buildColors[(Math.random() * buildColors.length) | 0];
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
      mesh.position.set(x, h/2, z); scene.add(mesh);
      buildings.push({ mesh, min: new THREE.Vector3(x - w/2, 0, z - d/2), max: new THREE.Vector3(x + w/2, h, z + d/2) });
    }
  }
}

// ======================================================================
// COLLISION HELPERS
// ======================================================================
const RADIUS = 0.5, EYE = 1.7, CROUCH_EYE = 1.1;
function collideHoriz(pos, delta, feetY, headY) {
  const attempts = [{ x: delta.x, z: delta.z }, { x: delta.x, z: 0 }, { x: 0, z: delta.z }];
  for (const d of attempts) {
    const nx = pos.x + d.x, nz = pos.z + d.z;
    let hit = false;
    for (const b of buildings) {
      if (b.max.y < feetY || b.min.y > headY) continue;
      const cx = Math.max(b.min.x, Math.min(nx, b.max.x));
      const cz = Math.max(b.min.z, Math.min(nz, b.max.z));
      const dx = nx - cx, dz = nz - cz;
      if (dx*dx + dz*dz < RADIUS*RADIUS) { hit = true; break; }
    }
    if (!hit) { pos.x = nx; pos.z = nz; return; }
  }
}
function groundY(x, z) {
  let top = 0;
  for (const b of buildings) {
    if (x < b.min.x || x > b.max.x || z < b.min.z || z > b.max.z) continue;
    if (b.max.y > top) top = b.max.y;
  }
  return top;
}
const rc = new THREE.Raycaster();
function raycastWorld(origin, dir, far) {
  rc.set(origin, dir); rc.far = far;
  const hits = rc.intersectObjects(buildings.map(b => b.mesh), false);
  return hits.length ? hits[0] : null;
}

// ======================================================================
// PLAYER
// ======================================================================
const player = {
  pos: new THREE.Vector3(0, EYE, 0), vel: new THREE.Vector3(),
  yaw: 0, pitch: 0, onGround: true, hp: 100, kills: 0, deaths: 0, streak: 0,
  dead: false, name: "player", crouching: false, ads: false, eyeH: EYE,
  recoil: 0, fovKick: 0, footAcc: 0,
};
const keys = new Set();
let locked = false;
const canvas = renderer.domElement;

document.getElementById("play").onclick = () => {
  player.name = (document.getElementById("name").value.trim() || "player").slice(0, 14);
  document.getElementById("menu").style.display = "none";
  canvas.requestPointerLock();
};
canvas.addEventListener("click", () => { if (!locked && !player.dead) canvas.requestPointerLock(); });
document.addEventListener("pointerlockchange", () => { locked = document.pointerLockElement === canvas; });
document.addEventListener("mousemove", (e) => {
  if (!locked) return;
  const s = player.ads ? 0.0012 : 0.0025;
  player.yaw -= e.movementX * s;
  player.pitch -= e.movementY * s;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
});
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === "KeyC" && locked) player.crouching = !player.crouching;
  if (e.code === "KeyR") reload();
  if (e.code === "KeyG") throwGrenade();
  if (e.code === "Digit1") switchWeapon("pistol");
  if (e.code === "Digit2") switchWeapon("rifle");
  if (e.code === "Tab") { e.preventDefault(); document.getElementById("scoreboard").style.display = "block"; }
});
addEventListener("keyup", (e) => {
  keys.delete(e.code);
  if (e.code === "Tab") { e.preventDefault(); document.getElementById("scoreboard").style.display = "none"; }
});
canvas.addEventListener("mousedown", (e) => {
  if (e.button === 0) mouseDown = true;
  if (e.button === 2) player.ads = true;
});
canvas.addEventListener("mouseup", (e) => {
  if (e.button === 0) mouseDown = false;
  if (e.button === 2) player.ads = false;
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function forward(v = new THREE.Vector3()) { v.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)); return v; }
function rightV(v = new THREE.Vector3())  { v.set( Math.cos(player.yaw), 0, -Math.sin(player.yaw)); return v; }
function lookDir(v = new THREE.Vector3()) {
  const p = player.pitch + player.recoil, cp = Math.cos(p);
  v.set(-Math.sin(player.yaw)*cp, Math.sin(p), -Math.cos(player.yaw)*cp);
  return v;
}

// ======================================================================
// WEAPONS
// ======================================================================
const WEAPONS = {
  pistol: { name: "Pistol", damage: 30, rpm: 300,  mag: 12, reload: 1.2, recoil: 0.04,  spread: 0.004, range: 200, scale: 1.0 },
  rifle:  { name: "Rifle",  damage: 18, rpm: 720,  mag: 30, reload: 1.8, recoil: 0.025, spread: 0.010, range: 350, scale: 1.3 },
};
let currentWeapon = "rifle";
const ammo = { pistol: WEAPONS.pistol.mag, rifle: WEAPONS.rifle.mag };
let lastShotAt = 0, reloadingUntil = 0, mouseDown = false;

// Viewmodel overlay scene
const vmScene = new THREE.Scene();
vmScene.add(new THREE.AmbientLight(0xffffff, 0.9));
const vmDL = new THREE.DirectionalLight(0xffffff, 0.5); vmDL.position.set(1,2,1); vmScene.add(vmDL);
const vmCam = new THREE.PerspectiveCamera(55, 1, 0.01, 5);
const gun = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.35), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
gunBody.position.set(0.15, -0.14, -0.32);
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 10), new THREE.MeshLambertMaterial({ color: 0x333333 }));
gunBarrel.rotation.x = Math.PI/2; gunBarrel.position.set(0.15, -0.11, -0.5);
const gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.08), new THREE.MeshLambertMaterial({ color: 0x0f0f0f }));
gunGrip.position.set(0.15, -0.22, -0.2);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.35, 8), new THREE.MeshLambertMaterial({ color: 0xd7b48f }));
arm.rotation.z = Math.PI / 2.2; arm.position.set(0.05, -0.22, -0.15);
gun.add(gunBody, gunBarrel, gunGrip, arm);
const flash = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2),
  new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: 0, depthWrite: false }));
flash.position.set(0.15, -0.10, -0.66); gun.add(flash);
const muzzleLight = new THREE.PointLight(0xffcc66, 0, 3, 2);
muzzleLight.position.set(0.15, -0.11, -0.65); gun.add(muzzleLight);
vmScene.add(gun);
let gunKick = 0, gunBob = 0, gunReloadAnim = 0;

function switchWeapon(w) {
  if (!WEAPONS[w]) return;
  currentWeapon = w;
  gun.scale.setScalar(WEAPONS[w].scale);
  updateAmmoHUD();
  updateWeapHUD();
}
function reload() {
  const now = performance.now();
  if (reloadingUntil > now) return;
  const w = WEAPONS[currentWeapon];
  if (ammo[currentWeapon] === w.mag) return;
  reloadingUntil = now + w.reload * 1000;
  gunReloadAnim = w.reload;
  sfxReload();
  document.getElementById("reloading").style.opacity = "1";
  setTimeout(() => { ammo[currentWeapon] = w.mag; updateAmmoHUD(); document.getElementById("reloading").style.opacity = "0"; }, w.reload * 1000);
}

// ======================================================================
// EFFECTS
// ======================================================================
const fx = [];
const grenades = new Map();
function tracer(from, to) {
  const g = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const m = new THREE.LineBasicMaterial({ color: 0xffee88, transparent: true });
  const line = new THREE.Line(g, m); scene.add(line);
  fx.push({ obj: line, life: 0.08, max: 0.08, decay: (o,t) => o.material.opacity = t });
}
function spark(at, color = 0xffaa33) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), new THREE.MeshBasicMaterial({ color, transparent: true }));
  s.position.copy(at); scene.add(s);
  fx.push({ obj: s, life: 0.25, max: 0.25, decay: (o,t) => { o.material.opacity = t; o.scale.setScalar(1 + (1-t)*2); } });
}
function explosion(at) {
  const fireball = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.9 }));
  fireball.position.copy(at); scene.add(fireball);
  fx.push({ obj: fireball, life: 0.6, max: 0.6, decay: (o,t) => { o.material.opacity = t * 0.9; o.scale.setScalar(1 + (1-t)*6); } });
  const light = new THREE.PointLight(0xffcc66, 8, 20, 2); light.position.copy(at); scene.add(light);
  fx.push({ obj: light, life: 0.4, max: 0.4, decay: (o,t) => o.intensity = 8 * t });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.8, 32),
    new THREE.MeshBasicMaterial({ color: 0xffeecc, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.copy(at); ring.position.y = Math.max(0.1, at.y - 0.5); scene.add(ring);
  fx.push({ obj: ring, life: 0.5, max: 0.5, decay: (o,t) => { o.material.opacity = t * 0.8; o.scale.setScalar(1 + (1-t)*12); } });
  for (let i = 0; i < 14; i++) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true }));
    d.position.copy(at);
    const dir = new THREE.Vector3(Math.random() - 0.5, Math.random(), Math.random() - 0.5).normalize().multiplyScalar(0.08);
    scene.add(d);
    fx.push({ obj: d, life: 0.6, max: 0.6, decay: (o, t) => { o.material.opacity = t; o.position.add(dir); dir.y -= 0.006; } });
  }
}
function updateFx(dt) {
  // grenades
  for (const [id, g] of grenades) {
    g.vel.y -= 18 * dt;
    g.pos.addScaledVector(g.vel, dt);
    const gy = groundY(g.pos.x, g.pos.z);
    if (g.pos.y < gy + 0.12) {
      g.pos.y = gy + 0.12; g.vel.y = -g.vel.y * 0.35; g.vel.x *= 0.6; g.vel.z *= 0.6;
    }
    g.mesh.position.copy(g.pos);
    g.mesh.rotation.x += dt * 6; g.mesh.rotation.z += dt * 4;
    g.timer -= dt;
    if (g.timer <= 0) {
      const at = g.pos.clone();
      explosion(at); sfxExplosion();
      // Damage bots
      for (const b of bots) {
        if (b.dead) continue;
        const dist = Math.hypot(b.pos.x - at.x, b.pos.y - at.y, b.pos.z - at.z);
        if (dist < 6) {
          const dmg = Math.round(90 * (1 - dist / 6));
          damageBot(b, dmg, g.owner);
        }
      }
      // Damage player if not owner (or self-damage from own grenade too)
      const pd = Math.hypot(player.pos.x - at.x, player.pos.y - at.y, player.pos.z - at.z);
      if (pd < 6) damagePlayer(Math.round(70 * (1 - pd / 6)));
      scene.remove(g.mesh); g.mesh.geometry.dispose();
      grenades.delete(id);
    }
  }
  // timed items
  for (let i = fx.length - 1; i >= 0; i--) {
    const it = fx[i]; it.life -= dt;
    if (it.life <= 0) {
      scene.remove(it.obj); it.obj.geometry?.dispose?.(); it.obj.material?.dispose?.();
      fx.splice(i, 1);
    } else it.decay(it.obj, Math.max(0, it.life / it.max));
  }
}

// ======================================================================
// AUDIO (procedural)
// ======================================================================
let actx = null, master = null;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.3; master.connect(actx.destination);
}
addEventListener("click", initAudio, { once: true });
addEventListener("keydown", initAudio, { once: true });
function envG(dur, peak = 1) {
  const g = actx.createGain(); const t = actx.currentTime;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur); return g;
}
function noiseBuf(dur) {
  const b = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
  const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const s = actx.createBufferSource(); s.buffer = b; return s;
}
function spatialGain(dist) {
  const g = actx.createGain(); g.gain.value = Math.max(0.04, 1 - dist / 80); g.connect(master); return g;
}
function sfxShoot(dist = 0, weapon = "rifle") {
  if (!actx) return;
  const out = spatialGain(dist);
  const n = noiseBuf(0.18);
  const bp = actx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = weapon === "rifle" ? 2800 : 1600; bp.Q.value = 0.9;
  const e = envG(weapon === "rifle" ? 0.12 : 0.16, 1.2);
  n.connect(bp).connect(e).connect(out); n.start(); n.stop(actx.currentTime + 0.2);
  const o = actx.createOscillator(); o.type = "sine";
  const t = actx.currentTime;
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.08);
  const oe = envG(0.09, 0.9); o.connect(oe).connect(out); o.start(); o.stop(t + 0.12);
}
function sfxHit(dist = 0) {
  if (!actx) return;
  const out = spatialGain(dist);
  const n = noiseBuf(0.05); const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1200;
  const e = envG(0.05, 0.7); n.connect(hp).connect(e).connect(out); n.start(); n.stop(actx.currentTime + 0.06);
}
function sfxHitmark() {
  if (!actx) return;
  const o = actx.createOscillator(); o.type = "square"; o.frequency.value = 1400;
  const e = envG(0.06, 0.4); o.connect(e).connect(master); o.start(); o.stop(actx.currentTime + 0.07);
}
function sfxReload() {
  if (!actx) return;
  for (let i = 0; i < 2; i++) {
    const n = noiseBuf(0.05); const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 800; bp.Q.value = 2;
    const g = actx.createGain(); const t = actx.currentTime + i * 0.35;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.6, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t + 0.08);
  }
}
function sfxJump() {
  if (!actx) return;
  const o = actx.createOscillator(); o.type = "sine";
  const t = actx.currentTime;
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(500, t + 0.09);
  const e = envG(0.09, 0.3); o.connect(e).connect(master); o.start(); o.stop(t + 0.11);
}
function sfxFoot() {
  if (!actx) return;
  const n = noiseBuf(0.04); const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
  const e = envG(0.05, 0.25); n.connect(lp).connect(e).connect(master); n.start(); n.stop(actx.currentTime + 0.05);
}
function sfxDeath() {
  if (!actx) return;
  const o = actx.createOscillator(); o.type = "sawtooth";
  const t = actx.currentTime;
  o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.7);
  const e = envG(0.7, 0.5); o.connect(e).connect(master); o.start(); o.stop(t + 0.75);
}
function sfxExplosion() {
  if (!actx) return;
  const n = noiseBuf(0.6); const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  const e = envG(0.6, 1.4); n.connect(lp).connect(e).connect(master); n.start(); n.stop(actx.currentTime + 0.65);
  const o = actx.createOscillator(); o.type = "sine";
  const t = actx.currentTime;
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
  const oe = envG(0.4, 1.0); o.connect(oe).connect(master); o.start(); o.stop(t + 0.45);
}
function sfxPickup() {
  if (!actx) return;
  const o = actx.createOscillator(); o.type = "triangle";
  const t = actx.currentTime;
  o.frequency.setValueAtTime(600, t); o.frequency.linearRampToValueAtTime(1200, t + 0.12);
  const e = envG(0.12, 0.4); o.connect(e).connect(master); o.start(); o.stop(t + 0.14);
}
function sfxStreak(kills) {
  if (!actx) return;
  const freqs = [523, 659, 784, 988];
  for (let i = 0; i < Math.min(kills, 4); i++) {
    const o = actx.createOscillator(); o.type = "triangle";
    o.frequency.value = freqs[i] || 1000;
    const t = actx.currentTime + i * 0.08;
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.17);
  }
}

// ======================================================================
// BOTS
// ======================================================================
const BOT_COUNT = 6;
const bots = [];
const botNames = ["Rex", "Nova", "Kai", "Zara", "Blaze", "Ghost", "Vex", "Ryu"];
const botColors = [0xff4444, 0xff8844, 0xff4488, 0x8844ff, 0x44ff88, 0x44aaff, 0xffff44, 0xffffff];
function makeBot(i) {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.0, 4, 10), new THREE.MeshLambertMaterial({ color: botColors[i] }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshLambertMaterial({ color: 0xffd2a8 }));
  head.position.y = 0.95;
  const g = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), new THREE.MeshLambertMaterial({ color: 0x222 }));
  g.position.set(0.3, 0.3, -0.15);
  grp.add(body, head, g);
  scene.add(grp);
  const bot = {
    group: grp, hp: 100, kills: 0, deaths: 0, streak: 0,
    name: botNames[i % botNames.length],
    color: botColors[i],
    pos: new THREE.Vector3((Math.random()-0.5)*80, 0.85, (Math.random()-0.5)*80),
    dir: Math.random() * Math.PI * 2, dirTimer: 0, shootTimer: Math.random()*2,
    dead: false, respawnAt: 0, bob: 0, lastPosX: 0, lastPosZ: 0,
  };
  grp.position.copy(bot.pos);
  return bot;
}
for (let i = 0; i < BOT_COUNT; i++) bots.push(makeBot(i));

function damageBot(bot, dmg, byPlayer) {
  if (bot.dead) return;
  bot.hp = Math.max(0, bot.hp - dmg);
  if (bot.hp === 0) {
    bot.dead = true; bot.group.visible = false; bot.respawnAt = performance.now() + 2500;
    bot.deaths += 1; bot.streak = 0;
    if (byPlayer) {
      player.kills += 1; player.streak += 1;
      addKill(player.name, bot.name);
      if (player.streak >= 2) showStreak(player.streak);
    } else {
      addKill("world", bot.name);
    }
  }
}
function respawnBot(bot) {
  bot.dead = false; bot.hp = 100;
  bot.pos.set((Math.random()-0.5)*80, 0.85, (Math.random()-0.5)*80);
  bot.group.visible = true;
}
function botUpdate(bot, dt, now) {
  if (bot.dead) { if (now >= bot.respawnAt) respawnBot(bot); return; }
  bot.dirTimer -= dt;
  if (bot.dirTimer <= 0) { bot.dir = Math.random()*Math.PI*2; bot.dirTimer = 1 + Math.random()*2; }
  const speed = 3.5;
  const step = new THREE.Vector3(Math.cos(bot.dir)*speed*dt, 0, Math.sin(bot.dir)*speed*dt);
  const posV = new THREE.Vector3(bot.pos.x, bot.pos.y + 0.5, bot.pos.z);
  collideHoriz(posV, step, bot.pos.y - 0.5, bot.pos.y + 1.5);
  const moved = Math.hypot(posV.x - bot.pos.x, posV.z - bot.pos.z);
  if (moved < speed*dt*0.1) bot.dirTimer = 0;
  bot.pos.x = posV.x; bot.pos.z = posV.z;
  const bound = CITY_SIZE * BLOCK;
  bot.pos.x = Math.max(-bound, Math.min(bound, bot.pos.x));
  bot.pos.z = Math.max(-bound, Math.min(bound, bot.pos.z));
  bot.pos.y = 0.85;
  bot.bob += dt * 10;
  const bobY = Math.sin(bot.bob) * 0.08 * (moved > 0.01 ? 1 : 0);
  bot.group.position.set(bot.pos.x, bot.pos.y + bobY, bot.pos.z);
  bot.group.rotation.y = -bot.dir + Math.PI/2;
  bot.lastPosX = bot.pos.x; bot.lastPosZ = bot.pos.z;

  bot.shootTimer -= dt;
  if (bot.shootTimer <= 0 && !player.dead) {
    bot.shootTimer = 0.9 + Math.random()*1.4;
    const from = bot.pos.clone(); from.y += 0.6;
    const to = player.pos.clone();
    const dir = to.clone().sub(from);
    const dist = dir.length();
    if (dist < 70) {
      dir.normalize();
      const hit = raycastWorld(from, dir, dist);
      if (!hit || hit.distance > dist - 0.5) {
        dir.x += (Math.random()-0.5) * 0.08;
        dir.y += (Math.random()-0.5) * 0.08;
        dir.z += (Math.random()-0.5) * 0.08;
        dir.normalize();
        const end = from.clone().addScaledVector(dir, 200);
        tracer(from, end);
        sfxShoot(dist, "rifle");
        const toPlayer = player.pos.clone().sub(from).normalize();
        if (dir.dot(toPlayer) > 0.994) damagePlayer(10);
      }
    }
  }
}

// ======================================================================
// PICKUPS (HP crates)
// ======================================================================
const pickups = [];
function makePickup() {
  const x = (Math.random() - 0.5) * (CITY_SIZE * BLOCK * 1.6);
  const z = (Math.random() - 0.5) * (CITY_SIZE * BLOCK * 1.6);
  const grp = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x22d3ee, emissive: 0x004466, emissiveIntensity: 0.5 }));
  const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.05), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.2, 0.05), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  c1.position.z = 0.26; c2.position.z = 0.26;
  grp.add(box, c1, c2);
  grp.position.set(x, 0.9, z);
  scene.add(grp);
  return { group: grp, active: true };
}
for (let i = 0; i < 6; i++) pickups.push(makePickup());
function updatePickups(dt, now) {
  for (const p of pickups) {
    p.group.rotation.y += dt * 2;
    p.group.position.y = 0.9 + Math.sin(now * 0.003 + p.group.position.x) * 0.1;
    if (p.active && !player.dead) {
      const dx = p.group.position.x - player.pos.x;
      const dz = p.group.position.z - player.pos.z;
      if (dx*dx + dz*dz < 1.5*1.5 && player.hp < 100) {
        player.hp = Math.min(100, player.hp + 50);
        p.active = false; p.group.visible = false;
        sfxPickup();
        setTimeout(() => {
          p.group.position.set((Math.random() - 0.5) * (CITY_SIZE * BLOCK * 1.6), 0.9, (Math.random() - 0.5) * (CITY_SIZE * BLOCK * 1.6));
          p.active = true; p.group.visible = true;
        }, 12000);
      }
    }
  }
}

// ======================================================================
// COMBAT (player shoot/grenade)
// ======================================================================
let lastGrenAt = -Infinity;
const GREN_CD = 3000;

function shoot(now) {
  if (player.dead || !locked) return;
  const w = WEAPONS[currentWeapon];
  const gap = 60000 / w.rpm;
  if (now - lastShotAt < gap) return;
  if (reloadingUntil > now) return;
  if (ammo[currentWeapon] <= 0) { reload(); return; }
  lastShotAt = now; ammo[currentWeapon] -= 1; updateAmmoHUD();
  gunKick = 0.08; flash.material.opacity = 1; flash.rotation.z = Math.random()*Math.PI;
  muzzleLight.intensity = 3;
  const spreadScale = player.ads ? 0.35 : 1;
  player.recoil = Math.min(0.25, player.recoil + w.recoil * (player.ads ? 0.6 : 1));
  player.fovKick = Math.min(6, player.fovKick + 2);
  sfxShoot(0, currentWeapon);

  const dir = lookDir().clone();
  dir.x += (Math.random()-0.5) * w.spread * spreadScale;
  dir.y += (Math.random()-0.5) * w.spread * spreadScale;
  dir.z += (Math.random()-0.5) * w.spread * spreadScale;
  dir.normalize();
  const eye = player.pos.clone();

  let bestT = w.range, bestBot = null, bestPoint = null;
  const tmp = new THREE.Vector3();
  for (const b of bots) {
    if (b.dead) continue;
    tmp.copy(b.pos).add(new THREE.Vector3(0, 0.6, 0)).sub(eye);
    const t = tmp.dot(dir);
    if (t < 0 || t > bestT) continue;
    const perpSq = tmp.lengthSq() - t*t;
    if (perpSq > 0.55*0.55) continue;
    bestT = t; bestBot = b; bestPoint = eye.clone().addScaledVector(dir, t);
  }
  const wall = raycastWorld(eye, dir, bestT);
  if (wall && wall.distance < bestT) { bestT = wall.distance; bestBot = null; bestPoint = wall.point; }
  const end = bestPoint ?? eye.clone().addScaledVector(dir, w.range);
  tracer(eye.clone().addScaledVector(dir, 0.5), end);
  if (bestPoint) spark(bestPoint, bestBot ? 0xff5555 : 0xffcc55);
  if (bestBot) {
    damageBot(bestBot, w.damage, true);
    document.getElementById("hit").style.opacity = "1";
    clearTimeout(window._hitT);
    window._hitT = setTimeout(() => document.getElementById("hit").style.opacity = "0", 100);
    sfxHitmark();
  }
}

function throwGrenade() {
  const now = performance.now();
  if (now - lastGrenAt < GREN_CD || player.dead) return;
  lastGrenAt = now;
  const dir = lookDir().clone();
  const v = dir.multiplyScalar(18);
  v.y += 3;
  const id = "g" + Math.random().toString(36).slice(2, 8);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), new THREE.MeshLambertMaterial({ color: 0x2b4a1c }));
  const pos = player.pos.clone(); pos.y -= 0.3;
  mesh.position.copy(pos);
  scene.add(mesh);
  grenades.set(id, { mesh, vel: v, pos, timer: 2.0, owner: "player" });
}

function damagePlayer(dmg) {
  if (player.dead) return;
  player.hp = Math.max(0, player.hp - dmg);
  const vig = document.getElementById("vignette");
  vig.style.boxShadow = `inset 0 0 220px 60px rgba(255,0,0,0.6)`;
  setTimeout(() => vig.style.boxShadow = "inset 0 0 200px 40px rgba(255,0,0,0)", 120);
  sfxHit(0);
  if (player.hp === 0) {
    player.dead = true; sfxDeath();
    player.deaths += 1; player.streak = 0;
    addKill("bot", player.name);
    document.getElementById("dead").style.display = "flex";
    setTimeout(() => {
      player.dead = false; player.hp = 100;
      player.pos.set(0, EYE, 0); player.vel.set(0,0,0);
      for (const k of Object.keys(ammo)) ammo[k] = WEAPONS[k].mag;
      updateAmmoHUD();
      document.getElementById("dead").style.display = "none";
    }, 2000);
  }
}

// ======================================================================
// HUD
// ======================================================================
function updateAmmoHUD() {
  const w = WEAPONS[currentWeapon];
  document.getElementById("ammo").textContent = `${ammo[currentWeapon]} / ${w.mag}`;
}
function updateWeapHUD() {
  document.getElementById("weap").innerHTML =
    `<b>${WEAPONS[currentWeapon].name}</b> &bull; [1] Pistol &bull; [2] Rifle &bull; R reload &bull; G granata`;
}
updateAmmoHUD(); updateWeapHUD();

const feed = document.getElementById("killfeed");
function addKill(by, target) {
  const el = document.createElement("div");
  el.textContent = `${by}  ->  ${target}`;
  feed.prepend(el);
  setTimeout(() => el.remove(), 4000);
}
const streakEl = document.getElementById("streak");
const streakNames = { 2: "DOUBLE KILL", 3: "TRIPLE KILL", 4: "RAMPAGE", 5: "UNSTOPPABLE", 7: "GODLIKE" };
function showStreak(n) {
  streakEl.textContent = streakNames[n] || `${n}x STREAK`;
  streakEl.style.opacity = "1";
  clearTimeout(streakEl._t);
  streakEl._t = setTimeout(() => streakEl.style.opacity = "0", 1400);
  sfxStreak(n);
}

const tagCache = new Map();
function ensureTag(id, name) {
  let el = tagCache.get(id);
  if (!el) {
    el = document.createElement("div"); el.className = "tag";
    el.innerHTML = `<div class="who">${name}</div><div class="bar"><span></span></div>`;
    document.body.appendChild(el);
    tagCache.set(id, el);
  }
  return el;
}
function drawTags() {
  const tmp = new THREE.Vector3();
  for (let i = 0; i < bots.length; i++) {
    const b = bots[i];
    if (b.dead) { const e = tagCache.get(i); if (e) e.style.display = "none"; continue; }
    tmp.set(b.pos.x, b.pos.y + 1.6, b.pos.z).project(camera);
    if (tmp.z > 1 || tmp.z < -1) { const e = tagCache.get(i); if (e) e.style.display = "none"; continue; }
    const sx = (tmp.x * 0.5 + 0.5) * innerWidth;
    const sy = (-tmp.y * 0.5 + 0.5) * innerHeight;
    const el = ensureTag(i, b.name);
    el.style.display = "block";
    el.style.left = sx + "px"; el.style.top = sy + "px";
    el.querySelector(".who").textContent = b.name;
    el.querySelector(".bar span").style.width = `${b.hp}%`;
  }
}

// Minimap (2D canvas)
const mmCanvas = document.querySelector("#minimap canvas");
const mmCtx = mmCanvas.getContext("2d");
function drawMinimap() {
  const W = mmCanvas.width, H = mmCanvas.height;
  const SCALE = 1.5; // pixels per meter
  mmCtx.clearRect(0, 0, W, H);
  mmCtx.fillStyle = "#111a24"; mmCtx.fillRect(0, 0, W, H);
  mmCtx.save();
  mmCtx.translate(W/2, H/2);
  mmCtx.rotate(player.yaw);
  mmCtx.translate(-player.pos.x * SCALE, -player.pos.z * SCALE);
  // buildings
  mmCtx.fillStyle = "#3a4453";
  for (const b of buildings) {
    mmCtx.fillRect(b.min.x*SCALE, b.min.z*SCALE, (b.max.x-b.min.x)*SCALE, (b.max.z-b.min.z)*SCALE);
  }
  // pickups
  for (const p of pickups) {
    if (!p.active) continue;
    mmCtx.fillStyle = "#22d3ee";
    mmCtx.fillRect(p.group.position.x*SCALE - 2, p.group.position.z*SCALE - 2, 4, 4);
  }
  // bots
  for (const b of bots) {
    if (b.dead) continue;
    mmCtx.fillStyle = "#f87171";
    mmCtx.beginPath(); mmCtx.arc(b.pos.x*SCALE, b.pos.z*SCALE, 3, 0, Math.PI*2); mmCtx.fill();
  }
  // player
  mmCtx.fillStyle = "#4ade80";
  mmCtx.beginPath(); mmCtx.arc(player.pos.x*SCALE, player.pos.z*SCALE, 4, 0, Math.PI*2); mmCtx.fill();
  mmCtx.restore();
  // North indicator
  mmCtx.fillStyle = "#fff"; mmCtx.font = "10px system-ui";
  mmCtx.fillText("N", W/2 - 4, 12);
}

function updateStats() {
  document.getElementById("stats").innerHTML =
    `<b>${player.name}</b><br>HP <b>${Math.round(player.hp)}</b><br>K/D <b>${player.kills}/${player.deaths}</b><br>Streak <b>${player.streak}</b>`;
}
function updateGrenCd(now) {
  const cd = Math.max(0, (GREN_CD - (now - lastGrenAt)) / 1000);
  const el = document.getElementById("grenCd");
  el.textContent = `G ${cd.toFixed(1)}s`;
  el.style.color = cd <= 0 ? "#4ade80" : "#fff";
}
function updateScoreboard() {
  const rows = [{ name: player.name, kills: player.kills, deaths: player.deaths, streak: player.streak, me: true }]
    .concat(bots.map(b => ({ name: b.name, kills: b.kills, deaths: b.deaths, streak: b.streak, me: false })))
    .sort((a, b) => b.kills - a.kills);
  document.getElementById("scoreTable").innerHTML =
    `<tr><th>#</th><th>Nome</th><th>K</th><th>D</th><th>Streak</th></tr>` +
    rows.map((r, i) => `<tr class="${r.me ? "me" : ""}"><td>${i+1}</td><td>${r.name}</td><td>${r.kills}</td><td>${r.deaths}</td><td>${r.streak}</td></tr>`).join("");
}

// ======================================================================
// LOOP
// ======================================================================
const GRAV = 18, SPEED = 6, RUN = 10, CROUCH_SPEED = 3, JUMP = 5.5;
let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;

  if (locked && !player.dead) {
    const running = !player.crouching && !player.ads && (keys.has("ShiftLeft") || keys.has("ShiftRight"));
    const s = player.crouching ? CROUCH_SPEED : (running ? RUN : (player.ads ? 4 : SPEED));
    const wish = new THREE.Vector3();
    const f = forward(), r = rightV();
    if (keys.has("KeyW")) wish.add(f);
    if (keys.has("KeyS")) wish.sub(f);
    if (keys.has("KeyD")) wish.add(r);
    if (keys.has("KeyA")) wish.sub(r);
    if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(s);
    player.vel.x = wish.x; player.vel.z = wish.z;
    player.vel.y -= GRAV * dt;
    if (player.onGround && keys.has("Space") && !player.crouching) {
      player.vel.y = JUMP; player.onGround = false; sfxJump();
    }

    const delta = new THREE.Vector3(player.vel.x*dt, 0, player.vel.z*dt);
    collideHoriz(player.pos, delta, player.pos.y - player.eyeH + 0.3, player.pos.y - 0.1);
    player.pos.y += player.vel.y * dt;

    const targetEye = player.crouching ? CROUCH_EYE : EYE;
    player.eyeH += (targetEye - player.eyeH) * Math.min(1, dt * 10);

    const gy = groundY(player.pos.x, player.pos.z) + player.eyeH;
    if (player.pos.y <= gy) { player.pos.y = gy; player.vel.y = 0; player.onGround = true; }
    else player.onGround = false;

    // footsteps
    const horizSpeed = Math.hypot(player.vel.x, player.vel.z);
    if (player.onGround && horizSpeed > 0.5) {
      player.footAcc += dt * horizSpeed * 0.5;
      if (player.footAcc > 1) { player.footAcc = 0; sfxFoot(); }
    }

    player.recoil = Math.max(0, player.recoil - dt * 1.2);
    player.fovKick = Math.max(0, player.fovKick - dt * 20);

    if (mouseDown) shoot(now);
  }

  for (const b of bots) botUpdate(b, dt, now);
  updatePickups(dt, now);
  updateFx(dt);

  // Camera
  camera.position.copy(player.pos);
  const ld = lookDir();
  camera.lookAt(player.pos.x + ld.x, player.pos.y + ld.y, player.pos.z + ld.z);
  camera.fov = (player.ads ? 40 : 70) + player.fovKick + (keys.has("ShiftLeft") || keys.has("ShiftRight") ? 5 : 0);
  camera.updateProjectionMatrix();

  // Viewmodel anims
  const moving = keys.has("KeyW")||keys.has("KeyS")||keys.has("KeyA")||keys.has("KeyD");
  gunBob += dt * (moving ? (keys.has("ShiftLeft")||keys.has("ShiftRight") ? 12 : 8) : 0);
  let rx = -gunKick;
  if (gunReloadAnim > 0) {
    gunReloadAnim = Math.max(0, gunReloadAnim - dt);
    rx -= 0.6 * Math.sin(Math.min(1, gunReloadAnim * 4) * Math.PI);
  }
  gun.position.x = Math.cos(gunBob*0.5)*0.008;
  gun.position.y = Math.sin(gunBob)*0.008 - 0.02;
  gun.rotation.x = rx;
  gunKick = Math.max(0, gunKick - dt * 0.9);
  flash.material.opacity *= Math.pow(0.0005, dt);
  muzzleLight.intensity *= Math.pow(0.001, dt);

  // Render world
  renderer.autoClear = true;
  renderer.render(scene, camera);
  // Viewmodel on top
  renderer.autoClear = false;
  renderer.clearDepth();
  vmCam.aspect = innerWidth/innerHeight; vmCam.updateProjectionMatrix();
  renderer.render(vmScene, vmCam);

  // HUD
  drawTags();
  drawMinimap();
  updateStats();
  updateGrenCd(now);
  updateScoreboard();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
