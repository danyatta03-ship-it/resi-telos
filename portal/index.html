<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="description" content="Invia un reso a Telos e segui la pratica.">
<meta name="robots" content="noindex, nofollow">
<title>Invia un reso · Telos</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reso Telos">

<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="boot">
  <div class="b-logo">T</div>
  <div class="b-txt">Caricamento…</div>
</div>

<noscript>
  <div style="max-width:420px;margin:60px auto;padding:24px;text-align:center">
    <h2>JavaScript è disattivato</h2>
    <p>Questa pagina serve per inviarci un reso e ha bisogno di JavaScript.
       Attivalo nelle impostazioni del browser e ricarica.</p>
    <p>In alternativa scrivici a
       <a href="mailto:resi.torino@telosgroup.it">resi.torino@telosgroup.it</a>.</p>
  </div>
</noscript>

<div id="app"></div>

<script type="module" src="./js/app.js"></script>

<script>
  // Il velo di caricamento sparisce da solo anche se i moduli non partono,
  // cosi' l'utente vede un errore invece di uno spinner eterno.
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !document.querySelector('.wrap')) {
      b.innerHTML = '<div class="b-txt">Non riesco a caricare la pagina.<br>' +
        'Controlla la connessione e ricarica.</div>';
    }
  }, 10000);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }
</script>

</body>
</html>
