<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="application-name" content="Tracking Resi">
<meta name="description" content="Portale di tracciamento resi: stato in tempo reale, documenti, comunicazioni.">
<meta name="robots" content="noindex, nofollow">
<title>Tracking Resi</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracking Resi">

<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">

<style>
  /* Schermata di avvio: evita il lampo di pagina bianca mentre i moduli
     ES vengono scaricati e Firebase risponde. */
  #boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--bg);
    z-index: 999;
    transition: opacity .2s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .b-in { text-align: center; }
  #boot .b-logo {
    width: 46px; height: 46px; margin: 0 auto 14px;
    border-radius: 11px; background: var(--brand-primary);
    display: grid; place-items: center;
    color: #fff; font-size: 21px; font-weight: 800;
  }
  #boot .b-txt { color: var(--text-3); font-size: 13px; }
  /* Nessun JS: l'app non puo' funzionare, ma l'utente deve capire perche'. */
  .nojs { max-width: 380px; margin: 0 auto; text-align: center; padding: 24px; }
</style>
</head>
<body>

<div id="boot">
  <div class="b-in">
    <div class="b-logo">T</div>
    <div class="b-txt">Caricamento…</div>
  </div>
</div>

<noscript>
  <div class="nojs">
    <h2>JavaScript disattivato</h2>
    <p>Questo portale richiede JavaScript per funzionare. Attivalo nelle impostazioni del browser e ricarica la pagina.</p>
  </div>
</noscript>

<div id="app"></div>

<!-- SDK Firebase (compat): stessa versione del gestionale, quindi gia' in
     cache per chi usa entrambi. storage e messaging sono opzionali: se non
     si caricano, upload e push si disabilitano da soli. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<!-- Config Firebase locale opzionale: se il file esiste definisce
     window.PORTAL_FIREBASE. In produzione si usa quella del gestionale
     gia' presente in localStorage, quindi il 404 e' previsto e innocuo. -->
<script src="./config/firebase.js" onerror="void 0"></script>

<script type="module" src="./js/app.js"></script>

<script>
  // Il boot screen sparisce appena l'app ha disegnato qualcosa.
  (function () {
    var boot = document.getElementById('boot');
    var app = document.getElementById('app');
    if (!boot || !app) return;
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      boot.classList.add('gone');
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 260);
    }
    var mo = new MutationObserver(function () { if (app.children.length) { mo.disconnect(); hide(); } });
    mo.observe(app, { childList: true });
    // Rete lenta o modulo che non parte: dopo 12s tolgo comunque il velo,
    // cosi' l'utente vede l'eventuale errore invece di uno spinner eterno.
    setTimeout(hide, 12000);
  })();

  // Service worker: solo su http(s), non su file://
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {
        // Senza SW il portale funziona, perde solo il supporto offline.
      });
    });
  }
</script>

</body>
</html>
